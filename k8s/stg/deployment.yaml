apiVersion: apps/v1
kind: Deployment

metadata:
  name: sample-app-stg
  namespace: stg  

spec:
  replicas: 1

  selector:
    matchLabels:
      app: sample-app-stg

  template:
    metadata:
      labels:
        app: sample-app-stg

    spec:
      containers:
      - name: sample-app-stg
        image: node:20-alpine

        envFrom:
          - configMapRef:
               name: sample-app-config
          - secretRef:
               name: sample-app-secret       

        command:
        - sh
        - -c

        args:
        - |
          apk add --no-cache git npm
          git clone https://github.com/github1001/devops-lab.git /app
          cd /app
          git checkout stg
          npm install
          npm start

        ports:
        - containerPort: 3000

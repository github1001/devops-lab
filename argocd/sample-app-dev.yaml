apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: sample-app-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/github1001/devops-lab.git
    targetRevision: main
    path: helm/sample-app

    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: dev

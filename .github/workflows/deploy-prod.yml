name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Git revision approved for production deployment"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Show approved deployment revision
        run: |
          echo "Approved production revision: ${{ inputs.revision }}"

      - name: Deploy production on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/devops-lab/sample-app

            git fetch origin

            git checkout main

            git pull --ff-only origin main

            CURRENT_REVISION=$(git rev-parse HEAD)

            if [ "$CURRENT_REVISION" != "${{ inputs.revision }}" ]; then
              echo "Refusing production deployment."
              echo "Approved revision: ${{ inputs.revision }}"
              echo "Current revision : $CURRENT_REVISION"
              exit 1
            fi

            docker compose \
              -f docker-compose.prod.yml \
              up -d --build

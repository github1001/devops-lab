apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.nameOverride }}
  namespace: {{ .Release.Namespace }}

spec:
  selector:
    app: {{ .Values.nameOverride }}

  ports:
  - port: {{ .Values.service.port }}
    targetPort: 3000
    nodePort: {{ .Values.service.nodePort }}

  type: {{ .Values.service.type }}

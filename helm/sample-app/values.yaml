nameOverride: sample-app

replicaCount: 1

image:
  repository: ghcr.io/github1001/devops-lab
  tag: dev
  pullPolicy: Always

service:
  type: NodePort
  port: 3000
  nodePort: 31011

ingress:
  enabled: true
  className: traefik
  host: dev.sample-app.local
  tlsSecret: sample-app-tls

config:
  appEnv: dev

secret:
  name: sample-app-secret
